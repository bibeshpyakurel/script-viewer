name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Clean checkout of the commit under test.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Required: Node 20. `cache: npm` reuses the npm cache keyed on the lockfile.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm

      # `ci` (not `install`) installs exactly the lockfile and fails if it drifted.
      - run: npm ci

      # Each step below fails the job on a non-zero exit — the default, so no
      # continue-on-error anywhere. Ordered cheapest-to-most-expensive.
      - run: npm run lint

      # The repo ships a format:check script that CI never called, so a
      # badly formatted file could reach main while the tooling to catch it
      # sat unused.
      - run: npm run format:check

      - run: npm run typecheck

      # Coverage thresholds are a ratchet; see vite.config.ts.
      - run: npm run test:coverage

      # The committed JSON artifact is regenerated and compared, so it can
      # never drift from the parser that produced it.
      - run: npm run export:json:check

      - run: npm run build
