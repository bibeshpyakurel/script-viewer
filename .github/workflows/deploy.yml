name: Deploy

# Publishes the production build to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages: write the Pages artifact and mint an OIDC
# token to prove the deployment came from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never let an older run overwrite a newer one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Pages serves from /<repo-name>/, so assets need that prefix. Set here
      # rather than in vite.config so the build still works at the domain root
      # anywhere else (local preview, Vercel, Netlify).
      - run: npm run build
        env:
          VITE_BASE: /script-viewer/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
