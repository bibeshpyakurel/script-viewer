name: Commits

# The changelog and release notes are generated from commit subjects, so the
# format is enforced rather than encouraged. A commit that does not parse is a
# change that vanishes from the release notes.
#
# The check body lives in bibeshpyakurel/github-workflows; the validator script
# itself stays in this repository at scripts/check-conventional-commits.sh.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: commits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    uses: bibeshpyakurel/github-workflows/.github/workflows/commits-reusable.yml@main
    permissions:
      contents: read
