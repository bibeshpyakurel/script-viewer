<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Script Viewer</title>
  <!--
    Colours are presentation ATTRIBUTES, not a <style> block.

    Favicon renderers frequently ignore CSS inside an SVG. An earlier version of
    this file set its fill through a <style> rule with a prefers-color-scheme
    query; where that CSS was dropped, the plate fell back to the SVG default
    fill (black) and the strokes to none, so the icon rendered as a black square
    with no glyph. Inline attributes always apply.

    The plate is the app's accent green, which stays legible against both a
    light and a dark browser tab strip, so the icon needs no theme awareness.
  -->
  <rect width="32" height="32" rx="7" fill="#2f6f5e" />
  <!--
    `</>`: angle brackets around a slash. Reads as markup at 16px, where a
    document outline with text lines would turn to mush.
  -->
  <g
    fill="none"
    stroke="#fbfbfa"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <polyline points="11.5,10 6.5,16 11.5,22" />
    <polyline points="20.5,10 25.5,16 20.5,22" />
    <line x1="18" y1="8.5" x2="14" y2="23.5" />
  </g>
</svg>
