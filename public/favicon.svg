<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Script Viewer">
  <title>Script Viewer</title>
  <!-- Palette matches the app's accent (--accent) and page background (--bg).
       An SVG favicon can follow the reader's theme, so the mark stays legible
       against both a light and a dark browser tab strip. -->
  <style>
    .plate { fill: #2f6f5e; }
    .glyph { stroke: #fbfbfa; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #7fc0ac; }
      .glyph { stroke: #17181a; }
    }
  </style>
  <rect class="plate" width="32" height="32" rx="7" />
  <!-- `</>`: angle brackets around a slash. Reads as markup at 16px, where a
       document outline with text lines would turn to mush. -->
  <g
    class="glyph"
    fill="none"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <polyline points="11.5,10 6.5,16 11.5,22" />
    <polyline points="20.5,10 25.5,16 20.5,22" />
    <line x1="18" y1="8.5" x2="14" y2="23.5" />
  </g>
</svg>
